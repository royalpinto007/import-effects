name: Publish PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check whether this version is already published
        id: registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          if python - "$version" <<'PY'
          import sys
          import urllib.error
          import urllib.request

          try:
              urllib.request.urlopen(
                  f"https://pypi.org/pypi/import-effects/{sys.argv[1]}/json", timeout=15
              )
          except urllib.error.HTTPError as error:
              raise SystemExit(1 if error.code == 404 else 2)
          PY
          then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with trusted publishing
        if: steps.registry.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

