name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - run: python -m build
      - run: twine check dist/*
      - name: Inspect distributions
        run: |
          python -m zipfile -l dist/*.whl
          tar -tzf dist/*.tar.gz
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
        exclude:
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/import-effects-consumer
      - run: /tmp/import-effects-consumer/bin/pip install dist/*.whl
      - run: /tmp/import-effects-consumer/bin/import-effects json --quiet
      - run: /tmp/import-effects-consumer/bin/python -c "from import_effects import inspect_import; assert inspect_import('json').success"

